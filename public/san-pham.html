<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Danh mục đầy đủ các mẫu Smart TV HXY và HIKERS chính hãng tại Trúc Nguyên Phát – TNP. Đầy đủ kích thước 32, 43, 50, 55, 65, 75, 85 inch.">
  <meta name="keywords" content="Sản phẩm TV HXY, TV HIKERS, Smart TV, QLED TV, Mini LED TV, Trúc Nguyên Phát, TNP">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Tất Cả Sản Phẩm TV HXY &amp; HIKERS | Trúc Nguyên Phát – TNP">
  <meta property="og:description" content="Khám phá và so sánh các mẫu TV HXY &amp; HIKERS chính hãng tại TNP.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <title>Danh Mục Sản Phẩm TV | Trúc Nguyên Phát – TNP</title>
  <link rel="canonical" href="http://localhost:3000/san-pham.html">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- HEADER (injected by components.js) -->
<div id="header-placeholder"></div>

<!-- ═══ PAGE HERO ═══ -->
<section class="page-hero">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="./index.html">Trang chủ</a>
      <span aria-hidden="true"><i class="fas fa-chevron-right"></i></span>
      <span>Sản phẩm</span>
    </nav>
    <h1 class="page-hero-title">Bộ sưu tập <span class="blue">Smart TV</span> Chính Hãng</h1>
    <p class="page-hero-desc">Đầy đủ các dòng TV thế hệ mới từ <strong>HXY</strong> và <strong>HIKERS</strong>. Sử dụng bộ lọc hoặc tính năng so sánh để tìm chiếc TV ưng ý nhất.</p>
  </div>
</section>

<!-- ═══ MAIN CONTENT ═══ -->
<main>
  <section class="section products-section">
    <div class="container">

      <!-- 1. TÁCH RIÊNG THƯƠNG HIỆU (BRAND TABS) -->
      <div class="brand-filter-tabs" role="tablist" aria-label="Lọc theo thương hiệu TV">
        <button class="brand-tab active" data-filter-brand="all" role="tab" aria-selected="true">
          <i class="fas fa-th-large" aria-hidden="true"></i>
          <div class="brand-tab-text">
            <strong>Tất cả thương hiệu</strong>
            <small>Xem cả HXY &amp; HIKERS</small>
          </div>
          <span class="brand-tab-count">12</span>
        </button>

        <button class="brand-tab tab-hxy" data-filter-brand="hxy" role="tab" aria-selected="false">
          <span class="brand-tab-badge blue" aria-hidden="true">HXY</span>
          <div class="brand-tab-text">
            <strong>TV HXY Việt Nam</strong>
            <small>4K UHD · QLED · OLED · Google TV</small>
          </div>
          <span class="brand-tab-count">6</span>
        </button>

        <button class="brand-tab tab-hikers" data-filter-brand="hikers" role="tab" aria-selected="false">
          <span class="brand-tab-badge red" aria-hidden="true">HIKERS</span>
          <div class="brand-tab-text">
            <strong>TV HIKERS Việt Nam</strong>
            <small>Mini LED · 144Hz · Dolby Atmos</small>
          </div>
          <span class="brand-tab-count">6</span>
        </button>
      </div>

      <!-- 2. BỘ LỌC CHI TIẾT THEO TIÊU CHÍ (KÍCH THƯỚC & CÔNG NGHỆ) -->
      <div class="filter-panel" role="region" aria-label="Bộ lọc tiêu chí sản phẩm">
        <!-- Hàng 1: Lọc kích thước -->
        <div class="filter-group">
          <span class="filter-group-label">
            <i class="fas fa-ruler-combined" aria-hidden="true"></i> Kích thước màn hình:
          </span>
          <div class="filter-chips-wrap">
            <button class="filter-chip active" data-filter-size="all">Tất cả kích thước</button>
            <button class="filter-chip" data-filter-size="32inch">32 inch</button>
            <button class="filter-chip" data-filter-size="43inch">43 inch</button>
            <button class="filter-chip" data-filter-size="50inch">50 inch</button>
            <button class="filter-chip" data-filter-size="55inch">55 inch</button>
            <button class="filter-chip" data-filter-size="65inch">65 inch</button>
            <button class="filter-chip" data-filter-size="75inch">75 inch</button>
            <button class="filter-chip" data-filter-size="large">85 inch+</button>
          </div>
        </div>

        <!-- Hàng 2: Lọc công nghệ & độ phân giải -->
        <div class="filter-group">
          <span class="filter-group-label">
            <i class="fas fa-microchip" aria-hidden="true"></i> Công nghệ &amp; Độ phân giải:
          </span>
          <div class="filter-chips-wrap">
            <button class="filter-chip active" data-filter-tech="all">Tất cả công nghệ</button>
            <button class="filter-chip" data-filter-tech="4k">4K Ultra HD</button>
            <button class="filter-chip" data-filter-tech="qled">QLED / Mini LED</button>
            <button class="filter-chip" data-filter-tech="large">Màn hình lớn (≥65")</button>
          </div>
        </div>

        <!-- Thanh thống kê & nút reset -->
        <div class="filter-status-bar">
          <div class="filter-status-info">
            Đang hiển thị: <strong id="filter-count">12</strong> mẫu TV
          </div>
          <button class="btn-reset-filter" id="reset-filter-btn">
            <i class="fas fa-redo-alt" aria-hidden="true"></i> Đặt lại bộ lọc
          </button>
        </div>
      </div>

      <!-- Product Grid (Rendered dynamically by script.js) -->
      <div class="product-grid" id="product-grid" role="list" aria-label="Danh sách sản phẩm"></div>

    </div>
  </section>
</main>

<!-- MODALS + FLOAT (injected by components.js) -->
<div id="modals-placeholder"></div>

<!-- FOOTER (injected by components.js) -->
<div id="footer-placeholder"></div>

<script src="./js/components.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
