<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f3f4f6"/>
  <!-- TV body -->
  <rect x="40" y="30" width="320" height="190" rx="12" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <!-- Screen -->
  <rect x="52" y="42" width="296" height="166" rx="6" fill="#111827"/>
  <!-- Screen glow -->
  <rect x="52" y="42" width="296" height="166" rx="6" fill="url(#screenGrad)" opacity="0.7"/>
  <!-- TV stand -->
  <rect x="178" y="220" width="44" height="14" rx="4" fill="#374151"/>
  <rect x="148" y="234" width="104" height="8" rx="4" fill="#374151"/>
  <!-- TNP Logo on screen -->
  <text x="200" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#1a3a6b">TRÚC NGUYÊN</text>
  <text x="200" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#c0392b">PHÁT</text>
  <text x="200" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Hình ảnh sản phẩm sẽ được cập nhật</text>
  <!-- Power button -->
  <circle cx="352" cy="205" r="5" fill="#4b5563"/>
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d1526" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
</svg>
